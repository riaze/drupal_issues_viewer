<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drupal Issues</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5f8;
      --surface: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --accent: #0678be;
      --accent-ink: #ffffff;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.04);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(1200px 400px at 10% -10%, #dbeafe 0%, transparent 55%),
        var(--bg);
      color: var(--ink);
    }
    .shell {
      max-width: 980px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 2.5rem;
    }
    .topbar, .footer-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.1rem 1.25rem;
      box-shadow: var(--shadow);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      min-width: 0;
    }
    .mark {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0678be, #0ea5e9);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      letter-spacing: -0.04em;
      flex: 0 0 auto;
    }
    h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .meta {
      margin: 0.2rem 0 0;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .pager {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .page-indicator {
      min-width: 5.5rem;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
    }
    a.btn, span.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 6.5rem;
      padding: 0.5rem 0.9rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      text-decoration: none;
      color: var(--ink);
      background: var(--surface);
      font-size: 0.88rem;
      font-weight: 600;
    }
    a.btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    a.btn:last-child {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }
    a.btn:last-child:hover { filter: brightness(1.05); color: var(--accent-ink); }
    span.btn {
      opacity: 0.45;
      cursor: not-allowed;
    }
    main {
      margin: 1rem 0;
      display: grid;
      gap: 0.75rem;
    }
    .issue {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1rem 1.15rem 1.05rem;
      box-shadow: var(--shadow);
    }
    .issue-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.55rem;
    }
    .issue h2 {
      margin: 0 0 0.4rem;
      font-size: 1.02rem;
      font-weight: 650;
      letter-spacing: -0.015em;
      line-height: 1.35;
    }
    .issue h2 a { color: inherit; text-decoration: none; }
    .issue h2 a:hover { color: var(--accent); }
    .tag {
      font-size: 0.7rem;
      font-weight: 650;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      padding: 0.18rem 0.5rem;
      border-radius: 999px;
      background: #eef2f7;
      color: var(--muted);
    }
    .tag.id { font-variant-numeric: tabular-nums; }
    .status-active { background: #dbeafe; color: #1d4ed8; }
    .status-needs-review, .status-needs-work, .status-needs-more-info {
      background: #fef3c7; color: #b45309;
    }
    .status-reviewed-tested, .status-fixed, .status-closed-fixed, .status-patch-to-be-ported {
      background: #dcfce7; color: #166534;
    }
    .status-closed-duplicate, .status-closed-won-t-fix, .status-closed-works-as-designed,
    .status-closed-outdated, .status-closed-cannot-reproduce, .status-postponed {
      background: #f1f5f9; color: #475569;
    }
    .priority-critical { background: #fee2e2; color: #b91c1c; }
    .priority-major { background: #ffedd5; color: #c2410c; }
    .priority-normal { background: #e0f2fe; color: #0369a1; }
    .priority-minor { background: #f1f5f9; color: #475569; }
    .summary {
      margin: 0;
      color: #475569;
      line-height: 1.5;
      font-size: 0.92rem;
    }
    .footer-bar {
      margin-top: 0.25rem;
    }
    .api-link {
      color: var(--muted);
      font-size: 0.85rem;
    }
    .api-link a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .api-link a:hover { text-decoration: underline; }
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.75rem 1.15rem;
      margin-top: 0.75rem;
      box-shadow: var(--shadow);
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
    }
    .filter-group select {
      padding: 0.35rem 0.6rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink);
      font-size: 0.85rem;
      outline: none;
    }
    .filter-group select:focus {
      border-color: var(--accent);
    }
    .btn-submit {
      padding: 0.35rem 0.8rem;
      background: var(--accent);
      color: var(--accent-ink);
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-submit:hover {
      filter: brightness(1.05);
    }
    @media (max-width: 700px) {
      .topbar, .footer-bar, .filter-bar { align-items: stretch; }
      .pager { width: 100%; justify-content: space-between; }
      a.btn, span.btn { flex: 1; min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">D</div>
        <div>
          <h1>Drupal project issues</h1>
          <p class="meta">Live feed from Drupal.org · $count issues on this page</p>
        </div>
      </div>
      <nav class="pager" aria-label="Pagination">
        $prev_link
        <span class="page-indicator">Page $page</span>
        $next_link
      </nav>
    </header>
    <form class="filter-bar" method="GET" action="/">
      <div class="filter-group">
        <label for="status">Status:</label>
        <select name="status" id="status">
          $status_options
        </select>
      </div>
      <div class="filter-group">
        <label for="priority">Priority:</label>
        <select name="priority" id="priority">
          $priority_options
        </select>
      </div>
      <input type="hidden" name="page" value="1">
      <button type="submit" class="btn-submit">Filter</button>
      <a href="/" class="btn" style="padding: 0.35rem 0.6rem; min-width: auto; font-size: 0.82rem;">Reset</a>
    </form>
    <main>
      $items_html
    </main>
    <footer class="footer-bar">
      <p class="api-link">JSON API · <a href="/api/issues?$api_query">/api/issues?$api_query</a></p>
      <nav class="pager" aria-label="Footer pagination">
        $prev_link
        <span class="page-indicator">Page $page</span>
        $next_link
      </nav>
    </footer>
  </div>
</body>
</html>
