[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drupal-issues-viewer"
version = "1.0.0"
description = "Paginated HTML and JSON viewer for Drupal.org project issues"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32,<3",
]

[project.scripts]
drupal-issues-viewer = "drupal_issues_viewer.__main__:main"

[tool.setuptools.packages.find]
include = ["drupal_issues_viewer*"]

[tool.setuptools.package-data]
drupal_issues_viewer = ["py.typed"]
